# Window rules configuration

# Ignore maximize requests from apps
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Elisa: float, no focus-steal, works with no active window
windowrule {
    name = elisa-float
    match:class = org.kde.elisa
    float = true
    nopocus = true
    size = 900 700
    move = 100 100
}
